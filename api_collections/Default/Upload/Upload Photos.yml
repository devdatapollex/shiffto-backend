info:
  name: Upload Photos
  type: http
  seq: 1

http:
  method: POST
  url: "{{localurl}}/api/v1/uploads/photos"
  headers:
    - name: Content-Type
      value: multipart/form-data
  body:
    type: multipart/form-data
    fields:
      - name: photos
        type: file
        value: ""
        fileMultiple: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
