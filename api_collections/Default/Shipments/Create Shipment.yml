info:
  name: Create Shipment
  type: http
  seq: 2

http:
  method: POST
  url: "{{localurl}}/api/v1/shipments"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "itemName": "Demo Shipment 6",
        "weight": 5,
        "quantity": 2,
        "description": "Demo description 6",
        "itemPhotos": ["http://localhost:5000/uploads/1785128577092-wallpaperflare.com_wallpaper.jpg"],
        "instructions": "Handle with care",
        "fromCountry": "BD",
        "toCountry": "QA",
        "pricePerKg": 15,
        "receiverName": "John Doe",
        "receiverPhone": "+1234567890",
        "receiverAddress": "123 Main St, City",
        "categoryId": "019f9d92-ad60-77ab-988d-6487918e4acc",
        "otp": "267748"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
