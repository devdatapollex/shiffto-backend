info:
  name: Create Shipment
  type: http
  seq: 2

http:
  method: POST
  url: "{{localurl}}/api/v1/shipments"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "itemName": "Laptop",
        "weight": 5,
        "quantity": 2,
        "description": "A laptop for international shipping",
        "itemPhotos": ["https://placehold.co/600x400?text=Item+Photo+Placeholder"],
        "instructions": "Handle with care",
        "fromCountry": "AR",
        "toCountry": "BD",
        "pricePerKg": 100,
        "receiverName": "John Doe",
        "receiverPhone": "+1234567890",
        "receiverAddress": "123 Main St, City",
        "categoryId": "019f5fd8-977a-73c8-b7f6-b050107ab379",
        "otp": "723294"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
