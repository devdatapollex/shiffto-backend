info:
  name: Confirm Check-in
  type: http
  seq: 9

http:
  method: POST
  url: "{{localurl}}/api/v1/shipments/{{shipmentId}}/steps/confirm-checkin"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "notes": "Package checked in at origin airport"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
