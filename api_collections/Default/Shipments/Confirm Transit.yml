info:
  name: Confirm Transit
  type: http
  seq: 10

http:
  method: POST
  url: "{{localurl}}/api/v1/shipments/{{shipmentId}}/steps/confirm-transit"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "notes": "Package in transit"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
