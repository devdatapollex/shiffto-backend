info:
  name: Sign Up
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:5000/api/auth/sign-up/email
  body:
    type: json
    data: |-
      {
        "name": "Test User",
        "email": "test@example.com",
        "password": "password123"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
