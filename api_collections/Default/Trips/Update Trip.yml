info:
  name: Update Trip
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{localurl}}/api/v1/trips/{{tripId}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "cabinBagCapacity": 3
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
