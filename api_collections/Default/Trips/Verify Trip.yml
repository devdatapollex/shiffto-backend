info:
  name: Verify Trip
  type: http
  seq: 6

http:
  method: POST
  url: "{{localurl}}/api/v1/trips/{{tripId}}/verify"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "approved": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
