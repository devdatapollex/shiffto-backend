info:
  name: Update Profile
  type: http
  seq: 2

http:
  method: PATCH
  url: "{{localurl}}/api/v1/profile"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Updated Name",
        "phone": "+1234567890"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
