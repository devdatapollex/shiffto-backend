info:
  name: Change Password
  type: http
  seq: 3

http:
  method: POST
  url: "{{localurl}}/api/v1/profile/change-password"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "currentPassword": "currentpass123",
        "newPassword": "newpass12345678",
        "confirmPassword": "newpass12345678"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
