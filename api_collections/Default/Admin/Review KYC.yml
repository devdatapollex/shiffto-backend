info:
  name: Review KYC
  type: http
  seq: 2

http:
  method: PATCH
  url: "{{localurl}}/api/v1/admin/kyc/{{kycId}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "status": "APPROVED"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
