name: Update Commission Rate
type: http
seq: 5

request:
  url: "{{baseUrl}}/api/v1/admin/settings/commission-rate"
  method: PATCH
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "commissionRate": 0.30
      }

auth:
  type: bearer
  token: "{{token}}"
