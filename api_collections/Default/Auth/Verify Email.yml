info:
  name: Verify Email
  type: http
  seq: 7

http:
  method: POST
  url: "{{localurl}}/api/auth/email-otp/verify-email"
  headers:
    - name: Origin
      value: "{{frontendurl}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "test1@example.com",
        "otp": "123456"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
