info:
  name: Send OTP
  type: http
  seq: 6

http:
  method: POST
  url: "{{localurl}}/api/auth/email-otp/send-verification-otp"
  headers:
    - name: Origin
      value: "{{frontendurl}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "test3@example.com",
        "type": "email-verification"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
