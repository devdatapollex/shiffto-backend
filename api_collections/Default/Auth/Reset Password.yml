info:
  name: Reset Password
  type: http
  seq: 9
http:
  method: POST
  url: "{{localurl}}/api/auth/email-otp/reset-password"
  headers:
    - name: Origin
      value: "{{frontendurl}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "test5@example.com",
        "otp": "123456",
        "password": "newPassword123"
      }
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
