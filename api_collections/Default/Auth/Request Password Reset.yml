info:
  name: Request Password Reset
  type: http
  seq: 8
http:
  method: POST
  url: "{{localurl}}/api/auth/email-otp/request-password-reset"
  headers:
    - name: Origin
      value: "{{frontendurl}}"
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "test5@example.com"
      }
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
